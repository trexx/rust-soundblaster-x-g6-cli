[package]
name = "g6-cli"
version = "0.0.3"
edition = "2021"
rust-version = "1.83"
description = "CLI tool for controlling the SoundBlaster X G6 on Windows"
license = "GPL-2.0-only"
readme = "readme.md"
repository = "https://github.com/trexx/rust-soundblaster-x-g6-cli"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
strip = true
lto = true
